name: Daily Brief Cron

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

jobs:
  trigger-daily-brief:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Daily Brief API
        run: |
          curl -s -o /dev/null -w "%{http_code}" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            https://chat.alphasightai.online/api/daily-brief
